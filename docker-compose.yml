services:
  redis:
    image: redis:7-alpine
    container_name: telecalling_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # MongoDB is provided by MongoDB Atlas (cloud).
  # For local development only — uncomment below:
